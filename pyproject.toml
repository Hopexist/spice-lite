[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spicelite"
dynamic = ["version"]
description = "A small SPICE-style circuit simulator using Modified Nodal Analysis"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
spicelite = "spicelite.cli:main"

[tool.setuptools.dynamic]
version = {attr = "spicelite.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125  # the codebase keeps long explanatory lines; the longest is 122
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]  # `l` for an inductor is the circuit-theory name, not an ambiguous one
