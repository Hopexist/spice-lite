<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spice-lite · circuit simulator in your browser</title>
    <meta name="description" content="Write a SPICE netlist, press Run, and see DC, AC and transient results. The simulator is Python running in your browser; nothing is uploaded." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />
    <script>
      // apply a stored theme before first paint so there is no flash
      try { var t = localStorage.getItem("spicelite-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip" href="#editor">Skip to the netlist editor</a>
    <header class="bar">
      <div class="brand">
        <!-- the mark: Figure 1, an RC step response on its axes (public/brand/mark.svg) -->
        <svg class="logo" viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><rect class="axis" x="12" y="10" width="7" height="78" /><rect class="axis" x="12" y="81" width="78" height="7" /><path class="curve" d="M19 81 C 34 38, 52 23, 90 20" fill="none" stroke-width="9" stroke-linecap="round" /></svg>
        <div>
          <h1 class="name">spice<span class="dot">·</span>lite</h1>
          <p class="tag">a circuit simulator that runs in your browser</p>
        </div>
      </div>
      <div class="controls">
        <label class="field"><span>Example</span><select id="examples"></select></label>
        <button id="run" class="btn primary" type="button"><span class="label">Run</span><kbd id="run-kbd">Ctrl&#8201;&#8629;</kbd></button>
        <button id="share" class="btn" type="button">Copy link</button>
        <button id="theme" class="btn" type="button" aria-label="Color theme: follow system"><span id="theme-label">Auto</span></button>
      </div>
    </header>
    <main class="split">
      <section class="pane editor-pane" aria-labelledby="editor-h">
        <div class="pane-head">
          <h2 id="editor-h">Netlist</h2>
          <p id="exdesc" class="desc"></p>
        </div>
        <div id="editor" class="editor"></div>
      </section>
      <section class="pane results-pane" aria-labelledby="results-h">
        <div class="pane-head">
          <h2 id="results-h">Results</h2>
          <p id="status" class="desc" role="status" aria-live="polite"></p>
        </div>
        <div id="messages"></div>
        <div id="boot" class="boot" hidden></div>
        <div id="results"></div>
      </section>
    </main>
    <footer class="foot">
      <span id="runtime">Python runtime not loaded yet</span>
      <span class="sep" aria-hidden="true">·</span>
      <a href="https://github.com/Hopexist/spice-lite">source on GitHub</a>
      <span class="sep" aria-hidden="true">·</span>
      <span>nothing you type leaves your browser</span>
    </footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
