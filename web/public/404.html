      :root { color-scheme: light dark; --bg: #fff; --ink: #111316; --muted: #4b5563; --signal: #0b4f9c; }

      main { max-width: 34rem; border-top: 3px solid var(--ink); padding-top: 24px; }
      h1 { margin: 0 0 8px; font-size: 2rem; letter-spacing: -0.02em; }
      p { margin: 0 0 16px; color: var(--muted); }
      a { color: var(--signal); font-weight: 600; text-underline-offset: 3px; }
    </style>
  </head>
