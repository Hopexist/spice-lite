name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ngspice (the reference simulator)
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          ngspice --version
      - name: Install spicelite
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Tests (ngspice comparisons must run, not skip)
        run: |
          set -o pipefail
          python -m pytest -q -rs | tee pytest.log
          if grep -q "skipped" pytest.log; then echo "ngspice tests were skipped"; exit 1; fi
      - name: CLI smoke test
        run: |
          spicelite --version
          spicelite run examples/rc_lowpass.cir -q --csv out --plot out
          test -s out/rc_lowpass_ac.csv && test -s out/rc_lowpass_ac.png
          spicelite run examples/inv_amp.cir > /dev/null
